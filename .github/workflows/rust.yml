# Rust CI Workflow
#
# Setup Requirements:
# 1. No secrets required (GITHUB_TOKEN is auto-provided)
#
# Workflow Triggers:
# - Push to main branch
# - Pull requests to main
# - Tags matching v[0-9]* (releases)

name: Rust

on:
  push:
    branches: [main]
    tags:
      - v[0-9]*
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: rustup override set ${{steps.toolchain.outputs.name}}
      - run: rustup component add rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: rustup override set ${{steps.toolchain.outputs.name}}
      - run: rustup component add clippy

      - uses: clechasseur/rs-clippy-check@v6.0.7
        with:
          args: --all-features -- --deny warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev \
            pkg-config \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-pipewire

      # The -dev packages above carry headers, which is all the compile needs.
      # The tests build real GStreamer pipelines, and an element only exists at
      # runtime if its plugin is installed -- so the plugin packages are
      # required here and only here. Without them
      # reserved_sockets_send_rtp_and_rtcp_on_loopback fails with
      # `no element "x264enc"`, which reads like a code fault but is a missing
      # gstreamer1.0-plugins-ugly.
      #
      # Which package holds what, for the elements these tests instantiate:
      #   base     videotestsrc, videoconvert, videoscale
      #   good     udpsink, rtpbin, rtpmp2tpay, imagefreeze, pulsesrc
      #   bad      mpegtsmux, h264parse, x265enc, svtav1enc, faac
      #   ugly     x264enc
      #   pipewire pipewiresrc

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps

  build:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - name: Build
        run: cargo build --verbose

      # Release publishing used to live here and has moved to release.yml.
      #
      # It failed on the v0.5.0 tag with "Resource not accessible by
      # integration" while trying to *update* an existing release -- because
      # release.yml had already created it. Two workflows publishing the same
      # release is the actual fault; granting this job contents:write would
      # only have let them both write, and they disagreed about what to write:
      #
      #   - this job named assets from Cargo.toml (swaybeam-0.4.3-x86_64.tar.gz)
      #     while the tag said v0.5.0, so a v0.5.0 release would have carried
      #     0.4.3 archives
      #   - release.yml names them from the tag and builds arm64 as well, which
      #     this job never did
      #
      # So this job is now purely a compile check, and release.yml owns
      # publishing. It still gates the release only loosely: the two run in
      # parallel, as release.yml's header explains.
