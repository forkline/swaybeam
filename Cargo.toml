[workspace]
members = [
    "crates/doctor",
    "crates/capture",
    "crates/stream",
    "crates/net",
    "crates/rtsp",
    "crates/daemon",
    "crates/cli",
    "crates/audio",
    "crates/external",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"
authors = ["swaybeam contributors"]
repository = "https://github.com/forkline/swaybeam"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# Note: tokio-util does not have a top-level sync feature, the features are io, codec, etc.
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
zbus = { version = "5", features = ["tokio"] }
rand = "0.8"
parking_lot = "0.12"

# PipeWire - matching versions required to prevent cargo resolver conflict.
# pipewire 0.10.0 depends on libspa-sys 0.10, while libspa 0.9.2 depends on libspa-sys 0.9.
# Both link to the same native library libspa-0.2, causing a linking conflict.
pipewire = "0.10"
libspa = "0.10"

# GStreamer
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-rtp = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zvariant = "5"

# Async
futures-util = "0.3"
